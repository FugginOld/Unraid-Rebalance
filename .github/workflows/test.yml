name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync php-cli >/dev/null

      - name: Syntax
        run: bash tests/syntax.sh

      - name: Engine and status integration tests
        run: bash tests/engine_test.sh
